<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地划词翻译</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <header>
    <strong>本地划词翻译</strong>
  </header>
  <main>
    <section class="settings-panel" aria-labelledby="settings-title">
      <h2 id="settings-title">设置</h2>
      <label class="switch setting-row">
        <span>点击页面其他位置时自动关闭</span>
        <input id="close-on-outside-click" type="checkbox">
      </label>
      <div class="language-row">
        <label>原文语言
          <select id="source-language">
            <option value="auto">自动识别</option>
            <option value="zh-Hans">简体中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="de">德语</option>
            <option value="fr">法语</option>
            <option value="es">西班牙语</option>
            <option value="it">意大利语</option>
            <option value="pt">葡萄牙语</option>
            <option value="ru">俄语</option>
          </select>
        </label>
        <button id="swap-languages" type="button" title="互换原文和目标语言" aria-label="互换原文和目标语言">⇄</button>
        <label>目标语言
          <select id="target-language">
            <option value="zh-Hans">简体中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="de">德语</option>
            <option value="fr">法语</option>
            <option value="es">西班牙语</option>
            <option value="it">意大利语</option>
            <option value="pt">葡萄牙语</option>
            <option value="ru">俄语</option>
          </select>
        </label>
      </div>
      <label class="switch setting-row">
        <span>保存翻译历史 <small>默认关闭，仅保存在本机</small></span>
        <input id="history-enabled" type="checkbox">
      </label>
    </section>
    <section class="history-section" aria-labelledby="history-title">
      <div class="section-heading">
        <h2 id="history-title">翻译历史</h2>
        <div id="privacy-note">开启后最多保存 200 条，不保存网页地址。</div>
      </div>
    <div class="tools">
      <input id="search" type="search" placeholder="搜索原文或译文" aria-label="搜索翻译历史">
      <button id="clear" type="button">全部清除</button>
    </div>
    <div id="summary" aria-live="polite"></div>
    <div id="empty">没有翻译历史。</div>
    <div id="history-list"></div>
    </section>
  </main>
  <script src="history.js"></script>
</body>
</html>
